function Tag({color,children}){
  const cols={green:{bg:"#00ff8830",border:"#00ff8860",text:"#00ff88"},yellow:{bg:"#ffaa0020",border:"#ffaa0060",text:"#ffaa00"},red:{bg:"#ff446620",border:"#ff446660",text:"#ff4466"},blue:{bg:"#3b82f620",border:"#3b82f660",text:"#60a5fa"},purple:{bg:"#a855f720",border:"#a855f760",text:"#c084fc"},orange:{bg:"#f9731620",border:"#f9731660",text:"#fb923c"}};
  const c=cols[color]||cols.blue;
  return <span style={{background:c.bg,border:`1px solid ${c.border}`,color:c.text,padding:"2px 6px",borderRadius:4,fontSize:10,fontWeight:700,letterSpacing:"0.05em",textTransform:"uppercase",fontFamily:"monospace",whiteSpace:"nowrap"}}>{children}</span>;
}

function RiskDot({risk}){
  const color=risk==="Low"?"#00ff88":risk==="Medium"?"#ffaa00":risk?.startsWith("Medium-High")?"#ff8844":"#ff4466";
  return <span style={{display:"inline-flex",alignItems:"center",gap:4,fontSize:11,color}}><span style={{width:6,height:6,borderRadius:"50%",background:color,display:"inline-block"}}/>{risk}</span>;
}

function Perf({label,val}){
  if(!val||val==="N/A") return null;
  return <div><div style={{color:T.muted,fontSize:10,fontFamily:"monospace"}}>{label}</div><div style={{fontSize:12,fontFamily:"monospace",fontWeight:600,color:val?.startsWith("+")?"#00ff88":val?.startsWith("-")?"#ff4466":T.text}}>{val}</div></div>;
}

function TradeCard({trade}){
  const [open,setOpen]=useState(false);
  const isBuy=trade.action==="BUY"||trade.action==="Purchase";
  const sc=trade.signal==="STRONG BUY SIGNAL"?"#00ff88":trade.signal==="WATCH"?"#ffaa00":T.muted;
  return(
    <div onClick={()=>setOpen(!open)} style={{background:T.card,border:`1px solid ${T.border}`,borderLeft:`3px solid ${sc}`,borderRadius:8,padding:"14px 16px",cursor:"pointer",marginBottom:10}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8}}>
        <div style={{flex:1,minWidth:0}}>
          <div style={{display:"flex",alignItems:"center",gap:7,flexWrap:"wrap",marginBottom:5}}>
            <span style={{fontFamily:"monospace",fontWeight:700,fontSize:15,color:"#00ff88"}}>{trade.ticker}</span>
            <Tag color={isBuy?"green":"red"}>{trade.action}</Tag>
            <Tag color={trade.signal==="STRONG BUY SIGNAL"?"green":trade.signal==="WATCH"?"yellow":"blue"}>{trade.signal==="STRONG BUY SIGNAL"?"⚡ Signal":trade.signal}</Tag>
          </div>
          <div style={{color:T.text,fontSize:13,marginBottom:3,fontWeight:600}}>{trade.trader}</div>
          <div style={{display:"flex",gap:10,flexWrap:"wrap",alignItems:"center"}}>
            <span style={{color:T.muted,fontSize:11}}>{trade.sector}</span>
            <RiskDot risk={trade.risk}/>
          </div>
        </div>
        {trade.returnRate&&trade.returnRate!=="—"&&<div style={{textAlign:"right",flexShrink:0}}><div style={{fontFamily:"monospace",fontSize:16,fontWeight:700,color:"#00ff88"}}>{trade.returnRate}</div><div style={{color:T.muted,fontSize:10}}>hist. avg</div></div>}
      </div>
      <div style={{display:"flex",gap:14,marginTop:8}}>
        <Perf label="1W" val={trade.perf1w}/><Perf label="1M" val={trade.perf1m}/><Perf label="Size" val={trade.amount}/>
      </div>
      {open&&<div style={{marginTop:14,paddingTop:14,borderTop:`1px solid ${T.border}`}}>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:12}}>
          {[{l:"Market Cap",v:trade.marketCap},{l:"Date",v:trade.date},{l:trade.committee?"Committee":"Fund Style",v:trade.committee||trade.fundStyle},{l:"Pattern",v:trade.pattern}].filter(x=>x.v).map(({l,v})=>(
            <div key={l} style={{background:T.card2,borderRadius:6,padding:"8px 10px"}}>
              <div style={{color:T.muted,fontSize:10,fontFamily:"monospace",marginBottom:3}}>{l.toUpperCase()}</div>
              <div style={{color:T.text,fontSize:12,lineHeight:1.4}}>{v}</div>
            </div>
          ))}
        </div>
        <div style={{color:T.text,fontSize:13,lineHeight:1.75}}>{trade.analysis}</div>
      </div>}
      <div style={{color:T.muted,fontSize:10,marginTop:8,fontFamily:"monospace"}}>{open?"▲ collapse":"▼ tap for analysis"}</div>
    </div>
  );
}

function Summary({data}){
  const all=[...(data.politicians||[]),...(data.funds||[])];
  const strong=all.filter(t=>t.signal==="STRONG BUY SIGNAL").length;
  const watches=all.filter(t=>t.signal==="WATCH").length;
  return(
    <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8,marginBottom:20}}>
      {[{l:"⚡ Signals",v:strong,c:"#00ff88"},{l:"👁 Watches",v:watches,c:"#ffaa00"},{l:"Politicians",v:(data.politicians||[]).length,c:"#60a5fa"},{l:"Funds",v:(data.funds||[]).length,c:"#c084fc"}].map(({l,v,c})=>(
        <div key={l} style={{background:T.card,border:`1px solid ${T.border}`,borderRadius:8,padding:"10px 8px",textAlign:"center"}}>
          <div style={{color:T.muted,fontSize:10,marginBottom:3}}>{l}</div>
          <div style={{color:c,fontSize:18,fontWeight:700,fontFamily:"monospace"}}>{v}</div>
        </div>
      ))}
    </div>
  );
}
