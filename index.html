function daysSince(dateStr) {
  const now = new Date();
  const past = new Date(dateStr);
  if (isNaN(past)) return "";
  const diff = Math.floor((now - past) / 86400000);
  if (diff === 0) return "today";
  if (diff === 1) return "yesterday";
  if (diff < 7) return diff + "d ago";
  if (diff < 30) return Math.floor(diff/7) + "w ago";
  return Math.floor(diff/30) + "mo ago";
}

function fmtDate(dateStr) {
  const d = new Date(dateStr);
  if (isNaN(d)) return dateStr;
  return (d.getMonth()+1) + "/" + d.getDate() + "/" + String(d.getFullYear()).slice(2);
}

function getRecentDate(daysAgo) {
  const d = new Date();
  d.setDate(d.getDate() - daysAgo);
  return d.toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"});
}

// ─────────────────────────────────────────────────────────────────────────────
// Free CORS proxy — for production, replace with your own
const CORS_PROXY = "https://cors-anywhere.herokuapp.com/";
const YAHOO_QUERY_URL = "https://query1.finance.yahoo.com/v8/finance/chart/";

async function fetchLivePrice(ticker) {
  try {
    const yt = yahooTicker(ticker);
    const url = `${CORS_PROXY}${YAHOO_QUERY_URL}${yt}?interval=1d&range=1d`;
    const response = await fetch(url);
    const data = await response.json();
    const result = data?.chart?.result?.[0];
    if (!result) throw new Error("No data");
    const meta = result.meta;
    const currentPrice = meta.regularMarketPrice;
    const previousClose = meta.previousClose;
    const change = currentPrice - previousClose;
    const changePercent = (change / previousClose) * 100;
    return {
      price: currentPrice,
      change: change,
      changePercent: changePercent,
      currency: meta.currency || "USD",
      marketState: meta.marketState || "REGULAR",
    };
  } catch (error) {
    console.error("Live price fetch failed:", error);
    return null;
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// PROFESSIONAL GENIUS RATING — Wilson score interval (95% confidence)
// ─────────────────────────────────────────────────────────────────────────────
function getGeniusRating(ticker, winRate, totalTrades, personalReturn = null) {
  const p = winRate / 100;
  const n = totalTrades;
  
  // Wilson score interval lower bound (95% confidence)
  const z = 1.96;
  const wilsonLower = (p + (z*z)/(2*n) - z * Math.sqrt((p*(1-p) + (z*z)/(4*n))/n)) / (1 + (z*z)/n);
  const adjustedWinRate = Math.max(0, wilsonLower) * 100;
  
  let score = 0;
  if (adjustedWinRate >= 85) score = 5;
  else if (adjustedWinRate >= 75) score = 4;
  else if (adjustedWinRate >= 65) score = 3;
  else if (adjustedWinRate >= 55) score = 2;
  else if (adjustedWinRate >= 50) score = 1.5;
  else score = 0.5;
  
  // Bonus for large sample size
  if (n >= 50) score += 1.5;
  else if (n >= 30) score += 1.2;
  else if (n >= 20) score += 0.9;
  else if (n >= 10) score += 0.5;
  else if (n >= 5) score += 0.2;
  
  // Penalty for very small samples
  if (n < 3) score = 0;
  else if (n < 5 && adjustedWinRate > 90) score = Math.min(score, 2.5);
  
  if (personalReturn !== null) {
    if (personalReturn >= 0.30) score += 1.5;
    else if (personalReturn >= 0.15) score += 0.8;
    else if (personalReturn >= 0.05) score += 0.3;
    else if (personalReturn < -0.15) score -= 1.5;
    else if (personalReturn < -0.05) score -= 0.5;
  }
  
  if (score >= 6.5) return { label: "🔥 TOP", color: "#ff4466", bg: "#ff446620", border: "#ff446660", description: "Elite signal — 95% confidence, large sample" };
  if (score >= 5) return { label: "✅ GOOD", color: "#00ff88", bg: "#00ff8820", border: "#00ff8860", description: "Verified signal — statistically significant" };
  if (score >= 3) return { label: "⚠️ SMALL", color: "#ffaa00", bg: "#ffaa0020", border: "#ffaa0060", description: "Promising but low sample — size 1-3%" };
  return { label: "❌ AVOID", color: "#64748b", bg: "#ffffff08", border: "#ffffff18", description: "Insufficient data or poor track record — pass" };
}

function getHistoricalAccuracy(ticker) {
  const records = HISTORICAL_RECORDS.filter(r => r.ticker === ticker);
  if (!records.length) return null;
  const correct = records.filter(r => r.outcome === "correct").length;
  return { correct, total: records.length, pct: Math.round((correct / records.length) * 100) };
}

// ─────────────────────────────────────────────────────────────────────────────
// BACKTEST ENGINE
// ─────────────────────────────────────────────────────────────────────────────
function parseReturn(str) {
  if (!str) return 0;
  return parseFloat(str.replace("%","").replace("+","")) / 100;
}

function runBacktest(records) {
  const byTicker = {};
  records.forEach(r => {
    if (!byTicker[r.ticker]) byTicker[r.ticker] = { ticker:r.ticker, signals:[], correct:0, total:0, returns:[] };
    const ret = parseReturn(r.actualReturn);
    byTicker[r.ticker].signals.push(r);
    byTicker[r.ticker].total++;
    byTicker[r.ticker].returns.push(ret);
    if (r.outcome === "correct") byTicker[r.ticker].correct++;
  });

  const tickers = Object.values(byTicker).map(t => {
    const avgReturn = t.returns.reduce((a,b)=>a+b,0) / t.returns.length;
    const winRate = Math.round((t.correct / t.total) * 100);
    const maxDrawdown = Math.min(...t.returns);
    const bestTrade = Math.max(...t.returns);
    return { ...t, avgReturn, winRate, maxDrawdown, bestTrade };
  }).sort((a,b) => b.winRate - a.winRate || b.avgReturn - a.avgReturn);

  const sorted = [...records].sort((a,b)=>new Date(a.signalDate)-new Date(b.signalDate));
  let portfolio = 10000;
  const curve = [{date:"Start", value:10000, label:"$10,000"}];
  sorted.forEach(r => {
    const ret = parseReturn(r.actualReturn);
    const positionSize = portfolio * 0.1;
    portfolio += positionSize * ret;
    curve.push({
      date: r.signalDate,
      value: Math.round(portfolio),
      label: `$${Math.round(portfolio).toLocaleString()}`,
      ticker: r.ticker,
      ret: r.actualReturn,
      outcome: r.outcome,
    });
  });

  const totalReturn = ((portfolio - 10000) / 10000 * 100).toFixed(1);
  const totalCorrect = records.filter(r=>r.outcome==="correct").length;
  const overallWinRate = Math.round((totalCorrect / records.length) * 100);

  return { tickers, curve, portfolio: Math.round(portfolio), totalReturn, overallWinRate, totalSignals: records.length };
}

function exportData() {
  const now = new Date();
  const pad = n => String(n).padStart(2,"0");
  const ts = now.getFullYear()+"-"+pad(now.getMonth()+1)+"-"+pad(now.getDate())+"_"+pad(now.getHours())+"-"+pad(now.getMinutes());
  const payload = {exportedAt:now.toISOString(), TOP10, HISTORICAL_RECORDS};
  const blob = new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href=url; a.download="whalewatch_"+ts+".json"; a.click();
  URL.revokeObjectURL(url);
}

function Tag({color,children}){
  const cols={
    green:{bg:"#00ff8830",border:"#00ff8860",text:"#00ff88"},
    yellow:{bg:"#ffaa0020",border:"#ffaa0060",text:"#ffaa00"},
    red:{bg:"#ff446620",border:"#ff446660",text:"#ff4466"},

    orange:{bg:"#f9731620",border:"#f9731660",text:"#fb923c"},
  };
  const c=cols[color]||cols.blue;
  return <span style={{background:c.bg,border:`1px solid ${c.border}`,color:c.text,padding:"2px 6px",borderRadius:4,fontSize:10,fontWeight:700,letterSpacing:"0.05em",textTransform:"uppercase",fontFamily:"monospace",whiteSpace:"nowrap"}}>{children}</span>;

function RiskDot({risk}){
  let riskLevel = "Medium";
  let color = "#ffaa00";
  let description = "Moderate risk — position size 3-5%";
  
  if (risk === "Low") {
    riskLevel = "Low";
    color = "#00ff88";
    description = "Low risk — position size 5-10%";
  } else if (risk === "Medium") {
    riskLevel = "Medium";
    color = "#ffaa00";
    description = "Moderate risk — position size 3-5%";
  } else if (risk === "Medium-High") {
    riskLevel = "Medium-High";
    color = "#ff8844";
    description = "Elevated risk — position size 1-3%";
  } else if (risk === "High") {
    riskLevel = "High";
    color = "#ff4466";
    description = "High risk — position size 0-1%";
  } else if (risk === "High (pre-IPO)") {
    riskLevel = "Very High";
    color = "#ff4466";
    description = "Speculative — pre-IPO, size 0% unless high conviction";
  }
  
  return (
    <span title={description} style={{display:"inline-flex",alignItems:"center",gap:4,fontSize:11,color, cursor:"help"}}>
      <span style={{width:6,height:6,borderRadius:"50%",background:color,display:"inline-block"}}/>
      Risk: {riskLevel}
    </span>
  );
}

// LIVE PRICE COMPONENT (fetches from Yahoo Finance)
// ─────────────────────────────────────────────────────────────────────────────
function LivePrice({ ticker }) {
  const [price, setPrice] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);

  const fetchPrice = useCallback(async () => {
    setLoading(true);
    setError(null);
    const data = await fetchLivePrice(ticker);
    if (data) {
      setPrice(data);
    } else {
      setError("Could not fetch");
    }
    setLoading(false);
  }, [ticker]);

  return (
    <div style={{ marginTop: 8 }}>
      <button
        onClick={(e) => { e.stopPropagation(); fetchPrice(); }}
        style={{
          background: "#00ff8810",
          border: "1px solid #00ff8830",
          color: "#00ff88",
          padding: "4px 10px",
          borderRadius: 6,
          fontSize: 11,
          fontFamily: "monospace",
          cursor: "pointer",
          display: "inline-flex",
          alignItems: "center",
          gap: 6,
        }}
      >
        {loading ? "🔄 Loading..." : "💰 Fetch Live Price"}
      </button>
      {price && (
        <div style={{ marginTop: 6, fontSize: 12, fontFamily: "monospace", background: T.card2, padding: "6px 10px", borderRadius: 6 }}>
          <span style={{ color: "#00ff88" }}>${price.price.toFixed(2)}</span>
          <span style={{ color: price.change >= 0 ? "#00ff88" : "#ff4466", marginLeft: 8 }}>
            {price.change >= 0 ? "+" : ""}{price.change.toFixed(2)} ({price.changePercent >= 0 ? "+" : ""}{price.changePercent.toFixed(2)}%)
          </span>
          <span style={{ color: T.muted, marginLeft: 8, fontSize: 10 }}>
            {price.marketState === "REGULAR" ? "🔴 Live" : "🟢 Closed"}
          </span>
        </div>
      )}
      {error && <div style={{ marginTop: 4, fontSize: 10, color: "#ff4466" }}>{error} — tap Yahoo Finance button instead</div>}
    </div>
  );
}

// BACKTEST PANEL
// ─────────────────────────────────────────────────────────────────────────────
function BacktestPanel({tracker}){
  const [sortBy,setSortBy]=useState("winRate");
  const [showCurve,setShowCurve]=useState(true);

  const bt = useMemo(()=>runBacktest(HISTORICAL_RECORDS),[]);

  const trackedSignals = Object.values(tracker);
  const trackedReturns = trackedSignals.map(s=>parseReturn(s.returnRate));
  const trackedPnl = trackedReturns.reduce((a,b)=>a+b,0);
  const trackedPnlPct = trackedSignals.length ? (trackedPnl/trackedSignals.length*100).toFixed(1) : null;

  const sorted = [...bt.tickers].sort((a,b)=>{
    if(sortBy==="winRate") return b.winRate - a.winRate;
    if(sortBy==="avgReturn") return b.avgReturn - a.avgReturn;
    if(sortBy==="total") return b.total - a.total;
    return 0;
  });

  const maxVal = Math.max(...bt.curve.map(p=>p.value));
  const minVal = Math.min(...bt.curve.map(p=>p.value));
  const range = maxVal - minVal || 1;

  return(
    <div className="fade-in">
      <div style={{background:T.card,border:"1px solid #6366f140",borderRadius:8,padding:"12px 16px",marginBottom:16}}>
        <div style={{color:"#818cf8",fontFamily:"monospace",fontWeight:700,fontSize:13,marginBottom:4}}>📊 BACKTEST ENGINE</div>
        <div style={{color:T.muted,fontSize:12,lineHeight:1.6}}>
          Runs every historical signal through a simulated $10k portfolio (10% position per signal).
          <span style={{color:"#ffaa00"}}> ⚠ SIMULATED — uses recorded return strings, not live price data.</span>
        </div>
        <div style={{background:"#ffaa0010",borderLeft:"3px solid #ffaa00",padding:"6px 10px",marginTop:10,borderRadius:4}}>
          <div style={{color:"#ffaa00",fontSize:10,fontFamily:"monospace",marginBottom:2}}>📅 FILING DELAY NOTE</div>
          <div style={{color:T.muted,fontSize:10,fontFamily:"monospace"}}>
            Assumes entry at signalDate. Real SEC/STOCK Act filings have 30-45 day delays. Actual returns may differ significantly.
          </div>
        </div>
      </div>

      <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:8,marginBottom:16}}>
        {[
          {l:"Overall Win Rate",v:bt.overallWinRate+"%",c:"#00ff88"},
          {l:"Simulated Return",v:"+"+bt.totalReturn+"%",c:"#00ff88"},
          {l:"Total Signals",v:bt.totalSignals,c:"#60a5fa"},
          {l:"Portfolio Value",v:"$"+bt.portfolio.toLocaleString(),c:"#c084fc"},
        ].map(({l,v,c})=>(
          <div key={l} style={{background:T.card,border:`1px solid ${T.border}`,borderRadius:8,padding:"12px 14px"}}>
            <div style={{color:T.muted,fontSize:10,fontFamily:"monospace",marginBottom:4}}>{l.toUpperCase()}</div>
            <div style={{color:c,fontSize:20,fontWeight:700,fontFamily:"monospace"}}>{v}</div>
          </div>
        ))}
      </div>

      {trackedSignals.length > 0 && (
        <div style={{background:"#00ff8810",border:"1px solid #00ff8830",borderRadius:8,padding:"12px 14px",marginBottom:16}}>
          <div style={{color:"#00ff88",fontFamily:"monospace",fontWeight:700,fontSize:12,marginBottom:6}}>📌 YOUR PERSONAL TRACKER (SIMULATED)</div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8}}>
            <div>
              <div style={{color:T.muted,fontSize:10,fontFamily:"monospace"}}>SIGNALS FOLLOWED</div>
              <div style={{color:"#00ff88",fontSize:18,fontWeight:700,fontFamily:"monospace"}}>{trackedSignals.length}</div>
            </div>
            <div>
              <div style={{color:T.muted,fontSize:10,fontFamily:"monospace"}}>AVG SIM. RETURN</div>
              <div style={{color:"#00ff88",fontSize:18,fontWeight:700,fontFamily:"monospace"}}>{trackedPnlPct ? "+"+trackedPnlPct+"%" : "—"}</div>
            </div>
            <div>
              <div style={{color:T.muted,fontSize:10,fontFamily:"monospace"}}>TICKERS</div>
              <div style={{color:T.text,fontSize:11,fontFamily:"monospace",lineHeight:1.6}}>{trackedSignals.map(s=>s.ticker).join(", ")}</div>
            </div>
          </div>
        </div>
      )}

      <div style={{background:T.card,border:`1px solid ${T.border}`,borderRadius:8,padding:"12px 14px",marginBottom:16}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>

            {showCurve?"▲ hide":"▼ show"}
          </button>
        </div>
        {showCurve&&(
          <div>
            <div style={{display:"flex",alignItems:"flex-end",gap:2,height:80,overflowX:"auto",paddingBottom:4}}>
              {bt.curve.map((p,i)=>{
                const h = Math.max(4, ((p.value - minVal) / range) * 72);

              <div style={{display:"flex",gap:10,marginTop:4}}>
                <span style={{color:T.muted,fontSize:10,fontFamily:"monospace"}}>Best: <span style={{color:"#00ff88"}}>{(t.bestTrade*100).toFixed(0)}%</span></span>
                <span style={{color:T.muted,fontSize:10,fontFamily:"monospace"}}>Worst: <span style={{color:"#ff4466"}}>{(t.maxDrawdown*100).toFixed(0)}%</span></span>
                <span style={{color:T.muted,fontSize:10,fontFamily:"monospace"}}>{t.correct}/{t.total} correct</span>
              </div>
            </div>
          );
        })}
      </div>

      <div style={{color:T.muted,fontSize:10,fontFamily:"monospace",lineHeight:1.8,padding:"10px 0"}}>
        ⚠ SIMULATED RESULTS: All returns are derived from recorded historical signal outcome strings, not actual trade execution prices, slippage, or fees. Past signal accuracy does not guarantee future results. Not financial advice.
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// APP ROOT
// ─────────────────────────────────────────────────────────────────────────────
function App(){
  const [market,setMarket]=useState("top10");
  const [tab,setTab]=useState("politicians");
  const [filter,setFilter]=useState("all");
  const [searchTicker,setSearchTicker]=useState("");
  const [loading,setLoading]=useState(false);
  const [refreshKey,setRefreshKey]=useState(0);
  const [tracker,setTracker]=useState(()=>loadTracker());

  const DATA = useMemo(()=>buildDATA(),[refreshKey]);

  function handleRefresh(){
    setLoading(true);
    setTimeout(()=>{ setRefreshKey(k=>k+1); setLoading(false); },500);
  }

  function handleTrack(cardId, trade){
    const next = {...tracker, [cardId]:{...trade, trackedAt: new Date().toISOString()}};
    setTracker(next);
    saveTracker(next);
  }

  const data=DATA[market]||{politicians:[],funds:[]};
  const isTop10=market==="top10";
  const isContracts=market==="contracts";
  const isBacktest=market==="backtest";
  const isMarket=!isTop10&&!isContracts&&!isBacktest;
  const trades=tab==="politicians"?(data.politicians||[]):(data.funds||[]);
  const searched=searchTicker?trades.filter(t=>t.ticker.toLowerCase().includes(searchTicker.toLowerCase())):trades;
  const filtered=filter==="all"?searched:filter==="signals"?searched.filter(t=>t.signal==="STRONG BUY SIGNAL"):searched.filter(t=>t.signal==="WATCH");

  const trackedCount = Object.keys(tracker).length;

  return(
    <div style={{minHeight:"100vh",background:T.bg,color:T.text,fontFamily:"system-ui,-apple-system,sans-serif",paddingBottom:40}}>
      <div style={{borderBottom:`1px solid ${T.border}`,padding:"14px 16px",background:T.panel,position:"sticky",top:0,zIndex:10}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <div style={{width:7,height:7,borderRadius:"50%",background:"#00ff88",boxShadow:"0 0 8px #00ff88"}}/>
            <span style={{fontFamily:"monospace",fontWeight:700,fontSize:17,letterSpacing:"0.08em"}}>
              WHALE<span style={{color:"#00ff88"}}>WATCH</span>
            </span>
            {trackedCount>0&&(
              <span style={{background:"#00ff8820",border:"1px solid #00ff8840",color:"#00ff88",borderRadius:10,padding:"1px 7px",fontSize:10,fontFamily:"monospace",fontWeight:700}}>
                {trackedCount} tracked
              </span>
            )}
          </div>
          <div style={{display:"flex",alignItems:"center",gap:6}}>
            <button onClick={e=>{e.stopPropagation();exportData();}} style={{background:"#00ff8815",border:"1px solid #00ff8840",color:"#00ff88",padding:"5px 10px",borderRadius:6,cursor:"pointer",fontFamily:"monospace",fontSize:11,fontWeight:700}}>⬇ Export</button>
            <button onClick={e=>{e.stopPropagation();handleRefresh();}} style={{background:T.card,border:`1px solid ${T.border}`,color:T.muted,padding:"5px 10px",borderRadius:6,cursor:"pointer",fontFamily:"monospace",fontSize:11,fontWeight:700}}>🔄</button>
            <span style={{color:T.muted,fontSize:11,fontFamily:"monospace"}}>{new Date().toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})}</span>
          </div>
        </div>
        <div style={{display:"flex",gap:4,overflowX:"auto",paddingBottom:2}}>
          {MARKETS.map(m=>(
            <button
              key={m.key}
              onClick={()=>{setMarket(m.key);setFilter("all");setTab("politicians");setSearchTicker("");}}
              style={{
                background:market===m.key?"#00ff8830":"transparent",
                border:`1px solid ${market===m.key?"#00ff8860":T.border}`,
                color:market===m.key?"#00ff88":T.muted,
                padding:"6px 10px",borderRadius:6,cursor:"pointer",
                fontFamily:"monospace",fontSize:11,fontWeight:700,
                whiteSpace:"nowrap",flexShrink:0,
              }}
            >
              {m.flag} {m.label}
            </button>
          ))}
        </div>
      </div>

      {loading ? (
        <div style={{display:"flex",justifyContent:"center",alignItems:"center",height:"60vh"}}>
          <div className="loading" style={{color:"#00ff88",fontFamily:"monospace",fontSize:16,fontWeight:700}}>🔄 Refreshing whale data...</div>
        </div>
      ) : (
        <div style={{padding:"16px",maxWidth:860,margin:"0 auto"}}>

          {isTop10&&(
            <>
              <div style={{background:T.card,border:"1px solid #00ff8840",borderRadius:8,padding:"12px 16px",marginBottom:20}}>
                <div style={{color:"#00ff88",fontFamily:"monospace",fontWeight:700,fontSize:13,marginBottom:4}}>🏆 TOP 10 GLOBAL PICKS</div>
                <div style={{color:T.muted,fontSize:12,lineHeight:1.6}}>Highest-conviction trades across all markets — ranked by signal strength, whale confluence, and historical track record. Tap any pick for full analysis.</div>
              </div>
              {TOP10.map((p,i)=><Top10Card key={i} pick={p}/>)}
            </>
          )}

          {isBacktest&&<BacktestPanel tracker={tracker}/>}

          {isContracts&&(
            <>
              <div style={{background:T.card,border:"1px solid #ffaa0040",borderRadius:8,padding:"12px 16px",marginBottom:20}}>
                <div style={{color:"#ffaa00",fontFamily:"monospace",fontWeight:700,fontSize:13,marginBottom:4}}>🤝 CONTRACT WATCH</div>
                <div style={{color:T.muted,fontSize:12,lineHeight:1.6}}>Tracks political donations and executive pledges flowing to government contract awards. Cross-referenced from FEC filings, OpenSecrets.org, and USASpending.gov.</div>
              </div>
              {CONTRACTS.map((c,i)=><ContractCard key={i} contract={c}/>)}
            </>
          )}

          {isMarket&&(
            <>
              <Summary data={data}/>
              <div style={{display:"flex",gap:4,marginBottom:16,background:T.panel,padding:4,borderRadius:8,border:`1px solid ${T.border}`}}>
                {[{key:"politicians",label:"🏛 Politicians"},{key:"funds",label:"🐋 Funds"}].map(({key,label})=>(
                  <button
                    key={key}
                    onClick={()=>{setTab(key);setFilter("all");setSearchTicker("");}}
                    style={{flex:1,background:tab===key?"#00ff8830":"transparent",border:`1px solid ${tab===key?"#00ff8860":"transparent"}`,color:tab===key?"#00ff88":T.muted,padding:"8px 0",borderRadius:6,cursor:"pointer",fontFamily:"monospace",fontSize:12,fontWeight:700}}
                  >
                    {label}
                  </button>
                ))}
              </div>
              <input
                value={searchTicker}
                onChange={e=>setSearchTicker(e.target.value)}
                placeholder="Filter by ticker..."
                style={{width:"100%",background:T.card,border:`1px solid ${T.border}`,color:T.text,padding:"8px 12px",borderRadius:6,fontFamily:"monospace",fontSize:12,marginBottom:12,outline:"none"}}
              />
              <div style={{display:"flex",gap:8,marginBottom:14,flexWrap:"wrap"}}>
                {[{key:"all",label:"All"},{key:"signals",label:"⚡ Signals"},{key:"watch",label:"👁 Watches"}].map(({key,label})=>(
                  <button
                    key={key}
                    onClick={()=>setFilter(key)}
                    style={{background:filter===key?T.card:"transparent",border:`1px solid ${filter===key?"#00ff8860":T.border}`,color:filter===key?"#00ff88":T.muted,padding:"5px 12px",borderRadius:20,cursor:"pointer",fontSize:12}}
                  >
                    {label}
                  </button>
                ))}
              </div>
              {filtered.length===0
                ? <div style={{color:T.muted,textAlign:"center",padding:40,fontFamily:"monospace"}}>no trades match this filter</div>
                : filtered.map((t,i)=><TradeCard key={i} trade={t} tracker={tracker} onTrack={handleTrack}/>)
              }
            </>
          )}

          <div style={{marginTop:32,paddingTop:16,borderTop:`1px solid ${T.border}`,color:T.muted,fontSize:11,fontFamily:"monospace",lineHeight:2}}>
            ⚠ Sources: STOCK Act · Register of Members Interests · EU Parliament disclosures · NPC/CPPCC registers · LegCo interests · SEC 13F · FEC.gov · OpenSecrets.org · USASpending.gov. NOT financial advice.{"\n\n"}
            📊 Backtest returns are SIMULATED from historical signal strings — not real execution prices.{"\n\n"}
            🐙 <a href="https://github.com/572kgdy8rm-max/whalewatch" target="_blank" rel="noopener noreferrer" style={{color:"#60a5fa",textDecoration:"none"}}>github.com/572kgdy8rm-max/whalewatch</a>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.render(<App/>, document.getElementById("root"));
</script>
</body>
</html>
