<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>WhaleWatch · Trade Supercomputer</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0a0a0f;color:#e2e8f0;font-family:system-ui,-apple-system,sans-serif;padding:20px}
  .container{max-width:800px;margin:0 auto}
  .card{background:#16161f;border:1px solid #1e1e2e;border-radius:12px;padding:16px;margin-bottom:12px}
  .ticker{font-family:monospace;font-weight:700;font-size:18px;color:#00ff88}
  .rating{display:inline-block;padding:2px 12px;border-radius:20px;font-size:11px;font-weight:700}
  .rating-top{background:#ff446620;border:1px solid #ff446660;color:#ff4466}
  .rating-good{background:#00ff8820;border:1px solid #00ff8860;color:#00ff88}
  .rating-small{background:#ffaa0020;border:1px solid #ffaa0060;color:#ffaa00}
  .rating-avoid{background:#ffffff08;border:1px solid #ffffff18;color:#64748b}
  .flex{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}
  .gap{gap:12px}
  .mt-2{margin-top:8px}
  .mb-2{margin-bottom:8px}
  .text-muted{color:#64748b;font-size:12px}
  .text-accent{color:#00ff88}
  input,button{background:#1e1e2e;border:1px solid #2a2a3a;color:#e2e8f0;padding:10px 16px;border-radius:8px;font-size:14px}
  button{background:#00ff8820;border-color:#00ff8860;color:#00ff88;cursor:pointer}
  .loading{opacity:0.6;pointer-events:none}
</style>
</head>
<body>
<div class="container">
  <div class="flex" style="margin-bottom:24px;border-bottom:1px solid #1e1e2e;padding-bottom:16px">
    <div class="flex gap" style="align-items:center">
      <div style="width:8px;height:8px;border-radius:50%;background:#00ff88"></div>
      <span style="font-family:monospace;font-weight:700;font-size:20px">WHALE<span style="color:#00ff88">WATCH</span></span>
      <span style="background:#00ff8820;border:1px solid #00ff8860;color:#00ff88;padding:2px 10px;border-radius:20px;font-size:10px">TRADE SUPERCOMPUTER</span>
    </div>
    <div class="text-muted" id="timestamp">--</div>
  </div>

  <div style="background:#1e1e2e;border-radius:12px;padding:16px;margin-bottom:20px">
    <div class="flex gap" style="margin-bottom:12px">
      <input type="text" id="tickerInput" placeholder="Enter ticker (e.g., NVDA, TSLA, LMT)" style="flex:1">
      <button id="fetchBtn">🔍 Get Signal</button>
    </div>
    <div class="text-muted" style="font-size:12px">Powered by Wilson score confidence intervals · Live from your own backend</div>
  </div>

  <div id="result"></div>

  <div class="text-muted" style="text-align:center;margin-top:32px;padding-top:16px;border-top:1px solid #1e1e2e;font-size:10px">
    ⚠️ NOT financial advice · Simulated returns · SEC filing delay: 30-45 days<br>
    🐋 WhaleWatch Trade Supercomputer · Backend on Render · Wilson score 95% CI
  </div>
</div>

<script>
// ============================================================
// YOUR LIVE BACKEND URL — UPDATE THIS TO YOUR RENDER URL
// ============================================================
const API_BASE = "https://whalewatch-l3ut.onrender.com";

// ============================================================
// Everything below works automatically
// ============================================================

async function fetchSignal(ticker) {
  const resultDiv = document.getElementById('result');
  resultDiv.innerHTML = '<div class="card" style="text-align:center"><div class="loading">🔄 Fetching supercomputer analysis...</div></div>';
  
  try {
    const response = await fetch(`${API_BASE}/v1/signal/${ticker.toUpperCase()}`);
    if (!response.ok) throw new Error(`API error: ${response.status}`);
    const data = await response.json();
    displaySignal(data);
  } catch (error) {
    resultDiv.innerHTML = `<div class="card" style="border-left:3px solid #ff4466">
      <div style="color:#ff4466;font-weight:700">⚠️ Error</div>
      <div class="text-muted mt-2">${error.message}</div>
      <div class="text-muted mt-2">Make sure your Render backend is running at ${API_BASE}</div>
    </div>`;
  }
}

function displaySignal(data) {
  const ratingClass = data.genius_rating === '🔥 TOP' ? 'rating-top' :
                      data.genius_rating === '✅ GOOD' ? 'rating-good' :
                      data.genius_rating === '⚠️ SMALL' ? 'rating-small' : 'rating-avoid';
  
  const html = `
    <div class="card" style="border-left:3px solid ${data.genius_rating === '🔥 TOP' ? '#ff4466' : '#00ff88'}">
      <div class="flex">
        <div>
          <span class="ticker">${data.ticker}</span>
          <div class="rating ${ratingClass}" style="margin-top:8px">${data.genius_rating}</div>
        </div>
        <div style="text-align:right">
          <div style="font-size:28px;font-weight:700;color:#00ff88">${data.position_pct}%</div>
          <div class="text-muted">position size</div>
        </div>
      </div>
      
      <div class="flex" style="margin-top:16px;gap:16px;flex-wrap:wrap">
        <div><span class="text-muted">Win rate</span><br><span class="text-accent" style="font-size:20px">${data.win_rate}%</span></div>
        <div><span class="text-muted">Trades</span><br><span class="text-accent" style="font-size:20px">${data.total_trades}</span></div>
        <div><span class="text-muted">Excess vs SPY</span><br><span class="text-accent" style="font-size:20px">+${data.excess_vs_spy}%</span></div>
        <div><span class="text-muted">Action</span><br><span style="color:#00ff88;font-size:16px">${data.action || 'TRADE'}</span></div>
      </div>
      
      <div style="margin-top:16px;background:#12121a;border-radius:8px;padding:12px">
        <div class="text-muted" style="margin-bottom:8px">📋 WILSON SCORE ANALYSIS</div>
        <div class="flex" style="gap:12px;flex-wrap:wrap">
          <div><span class="text-muted">Confidence</span><br><span class="text-accent">95%</span></div>
          <div><span class="text-muted">Rating</span><br><span class="text-accent">${data.genius_rating}</span></div>
          <div><span class="text-muted">Risk-adjusted</span><br><span class="text-accent">Wilson lower bound</span></div>
        </div>
        <div class="text-muted mt-2">${data.genius_rating === '🔥 TOP' ? 'Elite signal — 95% confidence, large sample' : data.genius_rating === '✅ GOOD' ? 'Verified signal — statistically significant' : data.genius_rating === '⚠️ SMALL' ? 'Promising but low conviction — size 1-3%' : 'Insufficient data — pass'}</div>
      </div>
      
      <div class="text-muted mt-2" style="font-size:10px">⏱ ${new Date(data.timestamp).toLocaleString()}</div>
    </div>
  `;
  
  document.getElementById('result').innerHTML = html;
  document.getElementById('timestamp').innerHTML = new Date().toLocaleTimeString();
}

// Set up event listeners
document.getElementById('fetchBtn').onclick = () => {
  const ticker = document.getElementById('tickerInput').value.trim();
  if (ticker) fetchSignal(ticker);
};
document.getElementById('tickerInput').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') fetchSignal(e.target.value.trim());
});

// Load NVDA by default to show it works
fetchSignal('NVDA');
</script>
</body>
</html>
