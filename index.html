<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>WhaleWatch · Trade Genius</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0a0a0f; color: #e2e8f0; font-family: system-ui, sans-serif; padding: 20px; }
  .container { max-width: 800px; margin: 0 auto; }
  .card { background: #16161f; border: 1px solid #1e1e2e; border-radius: 16px; padding: 20px; margin-bottom: 16px; }
  .ticker { font-family: monospace; font-size: 28px; font-weight: 800; color: #00ff88; }
  .rating { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; }
  .rating-top { background: #ff446620; color: #ff4466; }
  .rating-good { background: #00ff8820; color: #00ff88; }
  .rating-small { background: #ffaa0020; color: #ffaa00; }
  .rating-avoid { background: #ffffff10; color: #64748b; }
  input, button { background: #1e1e2e; border: 1px solid #2a2a3a; color: white; padding: 12px 16px; border-radius: 12px; font-size: 16px; }
  button { background: #00ff8820; border-color: #00ff8860; color: #00ff88; cursor: pointer; font-weight: bold; }
  .flex { display: flex; gap: 12px; flex-wrap: wrap; }
  .error { color: #ff4466; background: #ff446610; padding: 16px; border-radius: 12px; }
  .text-muted { color: #64748b; font-size: 12px; }
  .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 16px 0; background: #0f0f14; padding: 12px; border-radius: 12px; }
  .position-size { font-size: 36px; font-weight: 800; color: #00ff88; }
  .top10-item { background: #16161f; border: 1px solid #1e1e2e; border-radius: 12px; padding: 12px; margin-bottom: 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
  .top10-rank { font-size: 20px; font-weight: 800; color: #00ff8840; min-width: 40px; }
  .footer { text-align: center; font-size: 10px; color: #64748b; margin-top: 32px; padding-top: 16px; border-top: 1px solid #1e1e2e; }
  .loading { text-align: center; padding: 40px; color: #00ff88; }
</style>
</head>
<body>
<div class="container">
  <div class="flex" style="justify-content: space-between; align-items: center; margin-bottom: 20px;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <div style="width: 10px; height: 10px; background: #00ff88; border-radius: 50%;"></div>
      <span style="font-family: monospace; font-size: 20px; font-weight: 800;">WHALE<span style="color:#00ff88">WATCH</span></span>
      <span style="background: #00ff8820; padding: 2px 8px; border-radius: 20px; font-size: 10px;">SUPERCOMPUTER</span>
    </div>
    <div class="text-muted" id="date">--</div>
  </div>

  <div class="card">
    <div class="flex">
      <input type="text" id="tickerInput" placeholder="TICKER (NVDA, AAPL, TSLA)" value="NVDA" style="flex: 1;">
      <button id="fetchBtn">⚡ ANALYZE</button>
    </div>
    <div class="text-muted" style="margin-top: 12px;">🔬 Wilson score 95% CI · Excess returns vs S&P 500</div>
  </div>

  <h3 style="margin-bottom: 12px;">🏆 TOP 10 SIGNALS</h3>
  <div id="top10Container" class="loading">Loading top 10...</div>

  <div id="resultContainer"></div>

  <div class="footer">
    ⚠️ NOT FINANCIAL ADVICE · Wilson score confidence intervals<br>
    🐋 WhaleWatch v4.0
  </div>
</div>

<script>
  // YOUR CORRECT BACKEND URL
  const API_BASE = "https://whalewatch-13ut.onrender.com";
  
  document.getElementById('date').innerText = new Date().toLocaleDateString();
  
  // Test backend connection first
  async function testBackend() {
    try {
      const res = await fetch(`${API_BASE}/`);
      const data = await res.json();
      console.log('Backend connected:', data);
      return true;
    } catch (e) {
      console.error('Backend unreachable:', e);
      document.getElementById('top10Container').innerHTML = `
        <div class="error">
          ⚠️ Cannot reach backend at ${API_BASE}<br>
          Make sure Render is running and URL is correct.
        </div>
      `;
      return false;
    }
  }
  
  async function fetchTop10() {
    const container = document.getElementById('top10Container');
    container.innerHTML = '<div class="loading">Loading top 10...</div>';
    
    try {
      const response = await fetch(`${API_BASE}/v1/top10`);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const data = await response.json();
      
      if (!data.top_10 || data.top_10.length === 0) {
        container.innerHTML = '<div class="error">No top 10 data available</div>';
        return;
      }
      
      let html = '';
      data.top_10.forEach((item, i) => {
        const ratingClass = item.genius_rating === '🔥 TOP' ? 'rating-top' :
                           item.genius_rating === '✅ GOOD' ? 'rating-good' :
                           item.genius_rating === '⚠️ SMALL' ? 'rating-small' : 'rating-avoid';
        html += `
          <div class="top10-item" onclick="fetchSignal('${item.ticker}')">
            <span class="top10-rank">#${i+1}</span>
            <span style="font-weight: bold; min-width: 60px;">${item.ticker}</span>
            <span class="rating ${ratingClass}">${item.genius_rating}</span>
            <span style="color:#00ff88;">+${item.excess_vs_spy}% vs SPY</span>
            <span>💰 ${item.position_pct}%</span>
          </div>
        `;
      });
      container.innerHTML = html;
    } catch (error) {
      console.error('Top10 error:', error);
      container.innerHTML = `<div class="error">⚠️ Could not load top 10: ${error.message}</div>`;
    }
  }
  
  async function fetchSignal(ticker) {
    const container = document.getElementById('resultContainer');
    container.innerHTML = '<div class="loading">Analyzing...</div>';
    
    try {
      const response = await fetch(`${API_BASE}/v1/signal/${ticker}`);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const data = await response.json();
      
      if (data.error) throw new Error(data.error);
      
      const ratingClass = data.genius_rating === '🔥 TOP' ? 'rating-top' :
                         data.genius_rating === '✅ GOOD' ? 'rating-good' :
                         data.genius_rating === '⚠️ SMALL' ? 'rating-small' : 'rating-avoid';
      
      container.innerHTML = `
        <div class="card">
          <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;">
            <div>
              <span class="ticker">${data.ticker}</span>
              <div style="margin-top: 8px;"><span class="rating ${ratingClass}">${data.genius_rating}</span></div>
            </div>
            <div class="position-size">${data.position_pct}%</div>
          </div>
          <div class="stats-grid">
            <div><div class="text-muted">WILSON SCORE</div><div style="font-size: 24px; font-weight: 700;">${data.win_rate}%</div><div class="text-muted">${data.total_trades} trades</div></div>
            <div><div class="text-muted">EXCESS vs SPY</div><div style="font-size: 24px; font-weight: 700; color:#00ff88;">+${data.excess_vs_spy}%</div></div>
            <div><div class="text-muted">MAX DRAWDOWN</div><div style="font-size: 24px; font-weight: 700;">${data.max_drawdown}%</div></div>
          </div>
          <div style="background: #0f0f14; padding: 12px; border-radius: 12px; margin-top: 8px;">
            <div class="text-muted">📊 QUANT INTERPRETATION</div>
            <div style="font-size: 13px; margin-top: 6px;">
              ${data.genius_rating === '🔥 TOP' ? 'Statistically significant at 95% confidence. Position size: 5%.' :
                data.genius_rating === '✅ GOOD' ? 'Positive edge detected. Position size: 2.5%.' :
                data.genius_rating === '⚠️ SMALL' ? 'Limited sample. Position size: 1%.' :
                'Insufficient evidence. Avoid.'}
            </div>
          </div>
          <div class="text-muted" style="margin-top: 12px; text-align: right;">💰 Current price: $${data.current_price || 'N/A'}</div>
        </div>
      `;
    } catch (error) {
      container.innerHTML = `<div class="error">⚠️ Error: ${error.message}</div>`;
    }
  }
  
  document.getElementById('fetchBtn').onclick = () => {
    const ticker = document.getElementById('tickerInput').value.trim();
    if (ticker) fetchSignal(ticker);
  };
  document.getElementById('tickerInput').onkeypress = (e) => {
    if (e.key === 'Enter') fetchSignal(e.target.value.trim());
  };
  
  // Initialize
  testBackend().then(() => {
    fetchTop10();
    fetchSignal('NVDA');
  });
</script>
</body>
</html>
