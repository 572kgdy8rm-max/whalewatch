// 2. TRADE GENIUS ENGINE (Wilson score, excess returns, position sizing)
// --------------------------------------------------------------
function wilsonLowerBound(winRate, totalTrades) {
  if (totalTrades < 1) return 0;
  const p = winRate / 100;
  const n = totalTrades;
  const z = 1.96;
  const lower = (p + (z*z)/(2*n) - z * Math.sqrt((p*(1-p) + (z*z)/(4*n))/n)) / (1 + (z*z)/n);
  return Math.max(0, lower) * 100;
}

function getGeniusRating(winRate, totalTrades, maxDrawdown = null, personalReturn = null) {
  const adjustedWinRate = wilsonLowerBound(winRate, totalTrades);
  let score = 0;
  if (adjustedWinRate >= 85) score = 5;
  else if (adjustedWinRate >= 75) score = 4;
  else if (adjustedWinRate >= 65) score = 3;
  else if (adjustedWinRate >= 55) score = 2;
  else if (adjustedWinRate >= 50) score = 1.5;
  else score = 0.5;
  
  if (totalTrades >= 50) score += 1.5;
  else if (totalTrades >= 30) score += 1.2;
  else if (totalTrades >= 20) score += 0.9;
  else if (totalTrades >= 10) score += 0.5;
  else if (totalTrades >= 5) score += 0.2;
  
  if (maxDrawdown !== null && maxDrawdown < -0.25) score -= 1.5;
  else if (maxDrawdown !== null && maxDrawdown < -0.15) score -= 0.8;
  
  if (personalReturn !== null) {
    if (personalReturn >= 0.30) score += 1.5;
    else if (personalReturn >= 0.15) score += 0.8;
    else if (personalReturn >= 0.05) score += 0.3;
    else if (personalReturn < -0.15) score -= 1.5;
    else if (personalReturn < -0.05) score -= 0.5;
  }
  
  if (score >= 6.5) return { label: "🔥 TOP", color: "#ff4466", bg: "#ff446620", border: "#ff446660", positionPct: 0.05, desc: "Elite signal — 95% confidence" };
  if (score >= 5) return { label: "✅ GOOD", color: "#00ff88", bg: "#00ff8820", border: "#00ff8860", positionPct: 0.025, desc: "Verified signal — statistically significant" };
  if (score >= 3) return { label: "⚠️ SMALL", color: "#ffaa00", bg: "#ffaa0020", border: "#ffaa0060", positionPct: 0.01, desc: "Promising but low conviction" };
  return { label: "❌ AVOID", color: "#64748b", bg: "#ffffff08", border: "#ffffff18", positionPct: 0, desc: "Insufficient data or poor track record" };
}

function getHistoricalStats(ticker) {
  const records = HISTORICAL_RECORDS.filter(r => r.ticker === ticker);
  if (!records.length) return null;
  const correct = records.filter(r => r.outcome === "correct").length;
  const total = records.length;
  const returns = records.map(r => r.actualReturn);
  const spyReturns = records.map(r => r.spyReturn);
  const excessReturns = returns.map((r,i) => r - spyReturns[i]);
  const avgReturn = returns.reduce((a,b)=>a+b,0)/total;
  const avgExcess = excessReturns.reduce((a,b)=>a+b,0)/total;
  const maxDrawdown = Math.min(...returns);
  const bestTrade = Math.max(...returns);
  return { correct, total, winRate: (correct/total)*100, avgReturn, avgExcess, maxDrawdown, bestTrade, excessReturns };
}

// --------------------------------------------------------------
// 5. BACKTEST ENGINE (equity curve, per-ticker)
// --------------------------------------------------------------
function runBacktest() {
  const byTicker = new Map();
  for (const r of HISTORICAL_RECORDS) {
    if (!byTicker.has(r.ticker)) byTicker.set(r.ticker, []);
    byTicker.get(r.ticker).push(r);
  }
  const tickers = Array.from(byTicker.entries()).map(([ticker, records]) => {
    const correct = records.filter(r => r.outcome === "correct").length;
    const total = records.length;
    const winRate = (correct/total)*100;
    const avgReturn = records.reduce((s,r)=>s+r.actualReturn,0)/total;
    const avgExcess = records.reduce((s,r)=>s+(r.actualReturn - r.spyReturn),0)/total;
    const maxDrawdown = Math.min(...records.map(r=>r.actualReturn));
    const bestTrade = Math.max(...records.map(r=>r.actualReturn));
    return { ticker, correct, total, winRate, avgReturn, avgExcess, maxDrawdown, bestTrade, records };
  }).sort((a,b)=>b.winRate - a.winRate);
  
  let portfolio = 10000;
  const curve = [{date:"Start", value:10000}];
  for (const r of HISTORICAL_RECORDS.sort((a,b)=>new Date(a.signalDate)-new Date(b.signalDate))) {
    const positionSize = portfolio * 0.1;
    portfolio += positionSize * r.actualReturn;
    curve.push({date:r.signalDate, value:Math.round(portfolio), outcome:r.outcome, ticker:r.ticker});
  }
  const totalReturn = ((portfolio-10000)/10000*100).toFixed(1);
  const totalCorrect = HISTORICAL_RECORDS.filter(r=>r.outcome==="correct").length;
  const overallWinRate = (totalCorrect/HISTORICAL_RECORDS.length*100).toFixed(0);
  return { tickers, curve, portfolio:Math.round(portfolio), totalReturn, overallWinRate, totalSignals:HISTORICAL_RECORDS.length };
}

    tickerRows += `
      <div style="margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid ${T.border}">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><span style="font-family:monospace;font-weight:700;font-size:15px;color:#00ff88">${t.ticker}</span><div class="badge-genius" style="background:${rating.bg};border:1px solid ${rating.border};color:${rating.color}">${rating.label}</div></div>
        <div style="background:#ffffff10;border-radius:3px;height:6px;margin-bottom:6px"><div style="height:100%;width:${t.winRate}%;background:${barColor};border-radius:3px"></div></div>
        <div style="display:flex;gap:12px;font-size:11px;flex-wrap:wrap"><span>✅ ${t.correct}/${t.total} wins (${Math.round(t.winRate)}%)</span><span style="color:#00ff88">📈 Excess vs SPY: +${(t.avgExcess*100).toFixed(0)}%</span><span>📉 Max DD: ${(t.maxDrawdown*100).toFixed(0)}%</span><span>💰 Suggested: ${rating.positionPct*100}%</span></div>
      </div>
    `;
  }
  
  const content = `
    <div style="padding:16px;max-width:860px;margin:0 auto">
      <div style="background:${T.card};border-radius:8px;padding:12px;margin-bottom:16px;border:1px solid #6366f140"><div style="color:#818cf8;font-weight:700">📊 BACKTEST ENGINE</div><div style="font-size:12px;color:${T.muted}">Wilson score confidence intervals (95% statistical significance). Simulated $10k portfolio, 10% per signal.</div><div style="background:#ffaa0010;border-left:3px solid #ffaa00;padding:6px 10px;margin-top:10px;font-size:10px">⚠️ SEC filing delay 30-45 days. Trades simulated starting day after filing.</div></div>
      <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:16px"><div style="background:${T.card};padding:12px;border-radius:8px"><div style="color:${T.muted};font-size:10px">OVERALL WIN RATE</div><div style="color:#00ff88;font-size:22px;font-weight:700">${bt.overallWinRate}%</div></div><div style="background:${T.card};padding:12px;border-radius:8px"><div style="color:${T.muted};font-size:10px">SIM. RETURN</div><div style="color:#00ff88;font-size:22px;font-weight:700">+${bt.totalReturn}%</div></div></div>
      <div style="background:${T.card};border-radius:8px;padding:12px;margin-bottom:16px"><div style="font-weight:700;margin-bottom:10px">PER-TICKER BREAKDOWN</div>${tickerRows}</div>
      <div style="color:${T.muted};font-size:10px;font-family:monospace;text-align:center">⚠️ SIMULATED RESULTS — past accuracy does not guarantee future results.</div>
    </div>
  `;
  root.innerHTML = header + content;
  attachMarketListeners();
}

function renderContracts(root) {
  const header = `<div style="border-bottom:1px solid ${T.border};padding:12px 16px;background:${T.panel};position:sticky;top:0;z-index:10"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><div style="display:flex;align-items:center;gap:8px"><div style="width:7px;height:7px;border-radius:50%;background:#00ff88"></div><span style="font-family:monospace;font-weight:700;font-size:17px">WHALE<span style="color:#00ff88">WATCH</span></span><span style="background:#00ff8820;border:1px solid #00ff8840;color:#00ff88;border-radius:10px;padding:1px 7px;font-size:9px;font-weight:700">TRADE GENIUS</span></div><div style="color:${T.muted};font-size:11px">${new Date().toLocaleDateString()}</div></div><div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:4px">${MARKETS.map(m => `<button data-market="${m.key}" style="background:${currentMarket===m.key?'#00ff8830':'transparent'};border:1px solid ${currentMarket===m.key?'#00ff8860':T.border};color:${currentMarket===m.key?'#00ff88':T.muted};padding:6px 12px;border-radius:6px;font-family:monospace;font-size:11px;font-weight:700">${m.flag} ${m.label}</button>`).join('')}</div></div>`;
  let cards = '';
  for (const c of CONTRACTS) {
    cards += `
      <div style="background:${T.card};border-left:3px solid ${c.signal==='STRONG SIGNAL'?'#00ff88':'#ffaa00'};border-radius:8px;padding:14px;margin-bottom:10px">
        <div style="display:flex;justify-content:space-between"><div><span style="font-weight:700">${c.company}</span> (${c.ticker})<div class="tag" style="margin-top:4px;background:#ffaa0020;border-color:#ffaa0060;color:#ffaa00">${c.signal}</div></div><div style="text-align:right"><span style="color:#00ff88;font-weight:700">${c.contractValue}</span><div style="font-size:10px;color:${T.muted}">Gap: ${c.timingGap}</div></div></div>
        <div style="margin-top:12px;font-size:12px">${c.details}</div>
        <div style="margin-top:8px;background:${T.card2};padding:6px 8px;border-radius:6px;font-size:11px"><span style="color:#ffaa00">👁 Watch for:</span> ${c.watchFor}</div>
        <div style="margin-top:8px;color:${T.muted};font-size:10px">📄 Filing delay disclaimer: trades simulated after disclosure (30-45d lag).</div>
      </div>
    `;
  }
  root.innerHTML = header + `<div style="padding:16px;max-width:860px;margin:0 auto"><div style="background:${T.card};border:1px solid #ffaa0040;border-radius:8px;padding:12px;margin-bottom:20px"><div style="color:#ffaa00;font-weight:700">🤝 CONTRACT WATCH</div><div style="font-size:12px;color:${T.muted}">Tracks political donations → government contract awards (FEC / USASpending.gov).</div></div>${cards}</div>`;
  attachMarketListeners();
}

function attachMarketListeners() {
  document.querySelectorAll('[data-market]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      currentMarket = btn.getAttribute('data-market');
      render();
    });
  });
  document.querySelectorAll('.details').forEach(el => {
    if (el.classList && el.classList.contains('hidden')) return;
  });
  document.querySelectorAll('[onclick]').forEach(el => {
    if (el.getAttribute('onclick')?.includes('classList.toggle')) return;
  });
  window.toggleDetails = function(el) {
    const details = el.querySelector('.details');
    if (details) details.classList.toggle('hidden');
  };
}

// initial render
render();
})();
</script>
</body>
</html>
